   const snap=await get(ref(db,"loginSettings/current"));
   if(auth.currentUser){const creditRef=ref(db,"userCredits/"+auth.currentUser.uid);let low=false;const charged=await runTransaction(creditRef,v=>{if(!v)return;if(Number(v.balance||0)<0.5){low=true;return}v.balance=Math.round((Number(v.balance)-0.5+0.1)*10)/10;v.lastCreditEvent={type:'UPDATE',label:'Update charge: -0.5 +0.1',spent:0.5,returned:0.1,net:-0.4,at:Date.now()};return v});if(!charged.committed||low)throw new Error("Not enough credits for update. You need 0.5 credits.");}
   if(snap.exists())applySettings(snap.val());
   if(auth.currentUser){
    const creditSnap=await get(ref(db,"userCredits/"+auth.currentUser.uid));
    if(creditSnap.exists()){
     const cv=creditSnap.val(),today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
     const newDay=cv.dailyDate!==today,allowed=newDay?1+Number(cv.extraAttemptsNextDay||0):Number(cv.attemptsAllowed||1),used=newDay?0:Number(cv.attemptsUsed||0);
     document.getElementById("rgCreditBalance").textContent=Number(cv.balance||0).toFixed(1).replace(/\.0$/ , "");
     document.getElementById("rgCreditInfo").textContent=`Weekly +5 credits (Monday reset). Daily Checking: ${Math.max(0,allowed-used)} chance(s) left today. Last update: -0.5 +0.1 = -0.4 credits.`;
    }
   }
   localStorage.setItem("rg_login_release_seen",String(latest));
   label.textContent="Update Complete";pct.textContent="100%";document.getElementById("rgProcessingHint").textContent="Your update has been completed successfully.";b.textContent="COMPLETED";
   setTimeout(()=>layer.remove(),900);
  }catch(e){b.disabled=false;b.style.opacity="1";b.textContent="RETRY UPDATE";label.textContent="Update failed";document.getElementById("rgProcessingHint").textContent=e.message||"Could not load update settings. Please check your connection and retry."}
 };
});
</script>
